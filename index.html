<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            background-color: #111;
            border: 4px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui {
            margin-top: 10px;
            font-size: 18px;
            display: flex;
            gap: 20px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="ui">
        <span>WASD 或 方向键移动 | 空格键开火</span>
        <span id="scoreDisplay">得分: 0</span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('scoreDisplay');

        // 游戏配置
        const TILE_SIZE = 30;
        const COLS = 20;
        const ROWS = 20;
        const TANK_SPEED = 2;
        const BULLET_SPEED = 6;

        // 方向枚举
        const DIRS = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };

        // 键盘状态
        const keys = {
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false,
            ' ': false
        };

        window.addEventListener('keydown', e => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = true;
                e.preventDefault(); 
            }
        });
        window.addEventListener('keyup', e => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = false;
                e.preventDefault();
            }
        });

        // 矩形碰撞检测
        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
        }

        class Tank {
            constructor(x, y, color, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.w = TILE_SIZE - 2;
                this.h = TILE_SIZE - 2;
                this.color = color;
                this.dir = isPlayer ? DIRS.UP : DIRS.DOWN;
                this.isPlayer = isPlayer;
                this.speed = isPlayer ? TANK_SPEED : TANK_SPEED * 0.6;
                this.cooldown = 0;
                this.aiTimer = 0;
                this.hp = 1;
            }

            draw() {
                // 如果已经死亡，画成灰色残骸（或者你可以直接 return 让它消失）
                if (this.hp <= 0) {
                    ctx.fillStyle = '#444';
                    ctx.fillRect(this.x, this.y, this.w, this.h);
                    // 画个叉
                    ctx.strokeStyle = '#222';
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + this.w, this.y + this.h);
                    ctx.moveTo(this.x + this.w, this.y);
                    ctx.lineTo(this.x, this.y + this.h);
                    ctx.stroke();
                    return; 
                }

                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);

                // 画炮管
                ctx.fillStyle = '#ddd';
                const barrelLen = 10;
                const barrelWidth = 6;
                let bx = this.x + this.w / 2 - barrelWidth / 2;
                let by = this.y + this.h / 2 - barrelWidth / 2;

                if (this.dir === DIRS.UP) ctx.fillRect(bx, by - barrelLen, barrelWidth, barrelLen);
                if (this.dir === DIRS.DOWN) ctx.fillRect(bx, by, barrelWidth, barrelLen);
                if (this.dir === DIRS.LEFT) ctx.fillRect(bx - barrelLen, by, barrelLen, barrelWidth);
                if (this.dir === DIRS.RIGHT) ctx.fillRect(bx, by, barrelLen, barrelWidth);
            }

            update() {
                if (this.hp <= 0) return; // 死亡后不再更新逻辑

                if (this.cooldown > 0) this.cooldown--;

                let dx = 0, dy = 0;
                let moving = false;

                if (this.isPlayer) {
                    if (keys.w || keys.ArrowUp) { this.dir = DIRS.UP; dy = -this.speed; moving = true; }
                    else if (keys.s || keys.ArrowDown) { this.dir = DIRS.DOWN; dy = this.speed; moving = true; }
                    else if (keys.a || keys.ArrowLeft) { this.dir = DIRS.LEFT; dx = -this.speed; moving = true; }
                    else if (keys.d || keys.ArrowRight) { this.dir = DIRS.RIGHT; dx = this.speed; moving = true; }

                    if (keys[' '] && this.cooldown === 0) {
                        this.shoot();
                    }
                } else {
                    // 简单的AI逻辑
                    this.aiTimer--;
                    if (this.aiTimer <= 0) {
                        this.dir = Math.floor(Math.random() * 4);
                        this.aiTimer = 30 + Math.random() * 60;
                        if (Math.random() > 0.5) this.shoot();
                    }
                    if (this.dir === DIRS.UP) dy = -this.speed;
                    if (this.dir === DIRS.DOWN) dy = this.speed;
                    if (this.dir === DIRS.LEFT) dx = -this.speed;
                    if (this.dir === DIRS.RIGHT) dx = this.speed;
                    moving = true;
                }

                if (moving) {
                    let nextX = this.x + dx;
                    let nextY = this.y + dy;

                    if (nextX < 0) nextX = 0;
                    if (nextX + this.w > canvas.width) nextX = canvas.width - this.w;
                    if (nextY < 0) nextY = 0;
                    if (nextY + this.h > canvas.height) nextY = canvas.height - this.h;

                    let collided = false;
                    for (let wall of walls) {
                        if (rectIntersect({x: nextX, y: nextY, w: this.w, h: this.h}, wall)) {
                            collided = true;
                            break;
                        }
                    }

                    if (rectIntersect({x: nextX, y: nextY, w: this.w, h: this.h}, base)) {
                        collided = true;
                    }

                    if (!collided) {
                        this.x = nextX;
                        this.y = nextY;
                    } else if (!this.isPlayer) {
                        this.dir = Math.floor(Math.random() * 4);
                        this.aiTimer = 30;
                    }
                }
            }

            shoot() {
                this.cooldown = this.isPlayer ? 20 : 60; 
                let bx = this.x + this.w / 2 - 3;
                let by = this.y + this.h / 2 - 3;
                bullets.push(new Bullet(bx, by, this.dir, this.isPlayer));
            }
        }

        class Bullet {
            constructor(x, y, dir, isPlayer) {
                this.x = x;
                this.y = y;
                this.w = 6;
                this.h = 6;
                this.dir = dir;
                this.isPlayer = isPlayer;
                this.dead = false;
            }

            update() {
                if (this.dir === DIRS.UP) this.y -= BULLET_SPEED;
                if (this.dir === DIRS.DOWN) this.y += BULLET_SPEED;
                if (this.dir === DIRS.LEFT) this.x -= BULLET_SPEED;
                if (this.dir === DIRS.RIGHT) this.x += BULLET_SPEED;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.dead = true;
                }
            }

            draw() {
                ctx.fillStyle = this.isPlayer ? '#fff' : '#ffaa00';
                ctx.beginPath();
                ctx.arc(this.x + 3, this.y + 3, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 游戏状态
        let player = new Tank(9 * TILE_SIZE, 18 * TILE_SIZE, '#4CAF50', true);
        let enemies = [
            new Tank(1 * TILE_SIZE, 1 * TILE_SIZE, '#F44336', false),
            new Tank(17 * TILE_SIZE, 1 * TILE_SIZE, '#F44336', false)
        ];
        let bullets = [];
        let walls = [];
        let base = { x: 9 * TILE_SIZE, y: 19 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE };
        let gameOver = false;
        let win = false;
        let score = 0;

        function generateMap() {
            walls = [];
            for (let i = 0; i < 60; i++) {
                let x = Math.floor(Math.random() * COLS) * TILE_SIZE;
                let y = Math.floor(Math.random() * ROWS) * TILE_SIZE;
                
                if (y > 15 * TILE_SIZE) continue;
                if (x < 3 * TILE_SIZE && y < 3 * TILE_SIZE) continue;
                if (x > 16 * TILE_SIZE && y < 3 * TILE_SIZE) continue;

                let type = Math.random() > 0.3 ? 'brick' : 'steel';
                walls.push({ x, y, w: TILE_SIZE, h: TILE_SIZE, type });
            }
            walls.push({ x: 8 * TILE_SIZE, y: 18 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'brick' });
            walls.push({ x: 11 * TILE_SIZE, y: 18 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'brick' });
        }

        generateMap();

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 画基地
            ctx.fillStyle = '#FFD700'; 
            ctx.fillRect(base.x, base.y, base.w, base.h);
            ctx.fillStyle = '#000';
            ctx.font = '16px Arial';
            ctx.fillText('🦅', base.x + 18, base.y + 22);

            // 画墙
            for (let wall of walls) {
                if (wall.type === 'brick') {
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                    ctx.strokeStyle = '#5c2e0a';
                    ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
                } else {
                    ctx.fillStyle = '#888';
                    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                    ctx.strokeStyle = '#555';
                    ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
                }
            }

            // 画坦克
            if (player.hp > 0) player.draw();
            for (let enemy of enemies) enemy.draw(); // draw 方法内部已处理死亡残骸

            // 画子弹
            for (let bullet of bullets) bullet.draw();

            // UI
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = win ? '#4CAF50' : '#F44336';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(win ? '胜利！' : '游戏结束', canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.fillText('刷新页面重新开始', canvas.width / 2, canvas.height / 2 + 40);
            }
        }

        function update() {
            if (gameOver) return;

            if (player.hp > 0) player.update();
            for (let enemy of enemies) enemy.update(); // update 方法内部已拦截死亡逻辑

            // 子弹更新
            for (let i = bullets.length - 1; i >= 0; i--) {
                let bullet = bullets[i];
                bullet.update();

                // 子弹与墙碰撞
                for (let j = walls.length - 1; j >= 0; j--) {
                    let wall = walls[j];
                    if (rectIntersect(bullet, wall)) {
                        bullet.dead = true;
                        if (wall.type === 'brick') {
                            walls.splice(j, 1);
                        }
                        break;
                    }
                }

                // 子弹与基地碰撞
                if (rectIntersect(bullet, base)) {
                    bullet.dead = true;
                    gameOver = true;
                    win = false;
                }

                // 子弹与坦克碰撞
                if (bullet.isPlayer) {
                    for (let enemy of enemies) {
                        // 关键修复：判断 hp > 0，防止鞭尸
                        if (enemy.hp > 0 && rectIntersect(bullet, enemy)) {
                            bullet.dead = true;
                            enemy.hp = 0;
                            score += 100;
                            scoreEl.textContent = `得分: ${score}`;
                            break;
                        }
                    }
                } else {
                    if (player.hp > 0 && rectIntersect(bullet, player)) {
                        bullet.dead = true;
                        player.hp = 0;
                        gameOver = true;
                    }
                }

                if (bullet.dead) bullets.splice(i, 1);
            }

            // 检查胜利条件
            if (enemies.every(e => e.hp === 0)) {
                gameOver = true;
                win = true;
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
