<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - 自定义版</title>
    <style>
        :root {
            --primary: #4CAF50;
            --primary-hover: #45a049;
            --bg-color: #1a1a1a;
            --panel-bg: #2a2a2a;
            --text-color: #fff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            width: 600px;
            height: 600px;
        }

        canvas {
            background-color: #000;
            border: 4px solid #555;
            box-shadow: 0 0 25px rgba(0, 150, 255, 0.3);
            display: block;
            outline: none;
            cursor: crosshair;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
        }

        #ui {
            margin-top: 15px;
            font-size: 18px;
            display: flex;
            gap: 20px;
            align-items: center;
            background: #333;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #555;
        }

        .highlight { color: var(--primary); font-weight: bold; }
        .key-hint { color: #ffaa00; font-weight: bold; }

        /* 遮罩层基础样式 */
        .overlay {
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            background-color: rgba(0, 0, 0, 0.9);
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 2px;
        }

        .overlay.active {
            display: flex;
        }

        .overlay h2 {
            font-size: 50px;
            margin: 0 0 20px 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }

        /* 菜单面板通用样式 */
        .menu-panel {
            background-color: var(--panel-bg);
            padding: 30px 40px;
            border-radius: 12px;
            border: 1px solid #444;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* 主菜单按钮 */
        .main-menu-btn {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            padding: 15px;
            font-size: 20px;
        }
        .main-menu-btn:last-child {
            margin-bottom: 0;
        }

        /* 设置项 */
        .setting-item {
            margin-bottom: 20px;
            text-align: left;
        }

        .setting-item label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 16px;
            color: #ddd;
        }

        .setting-item .value-display {
            color: var(--primary);
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: #444;
            border-radius: 3px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: var(--primary);
            margin-top: -6px;
            transition: transform 0.1s;
        }

        /* 皮肤选择器 */
        .color-swatches {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .color-swatch {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .color-swatch:hover {
            transform: scale(1.1);
        }

        .color-swatch.selected {
            border-color: #fff;
            transform: scale(1.1);
        }

        /* 按钮通用样式 */
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            outline: none;
            width: 100%;
        }

        .btn:hover { background-color: var(--primary-hover); }
        .btn:active { transform: scale(0.98); }
        
        .btn-secondary {
            background-color: #555;
            margin-top: 15px;
        }
        .btn-secondary:hover { background-color: #666; }

        #uiRestartBtn {
            width: auto;
            margin-top: 0;
            padding: 8px 16px;
        }

    </style>
</head>
<body>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600" tabindex="0"></canvas>
        
        <!-- 1. 主菜单页面 -->
        <div id="mainMenuScreen" class="overlay active">
            <h2>坦克大战</h2>
            <div class="menu-panel">
                <button id="goToStartBtn" class="btn main-menu-btn">开始游戏</button>
                <button id="goToSettingsBtn" class="btn main-menu-btn btn-secondary">游戏设置</button>
                <button id="goToSkinBtn" class="btn main-menu-btn btn-secondary">更换皮肤</button>
            </div>
        </div>

        <!-- 2. 游戏设置面板 -->
        <div id="settingsScreen" class="overlay">
            <h2>游戏设置</h2>
            <div class="menu-panel">
                <div class="setting-item">
                    <label>玩家移动速度 <span id="valPlayerSpeed" class="value-display">0.4</span></label>
                    <input type="range" id="playerSpeed" min="0.1" max="2.0" step="0.1" value="0.4">
                </div>
                <div class="setting-item">
                    <label>敌人移动速度 <span id="valEnemySpeed" class="value-display">0.15</span></label>
                    <input type="range" id="enemySpeed" min="0.05" max="1.0" step="0.05" value="0.15">
                </div>
                <div class="setting-item">
                    <label>敌人数量 <span id="valEnemyCount" class="value-display">4</span></label>
                    <input type="range" id="enemyCount" min="1" max="8" step="1" value="4">
                </div>
                <div class="setting-item">
                    <label>射击冷却 (帧) <span id="valShootCooldown" class="value-display">30</span></label>
                    <input type="range" id="shootCooldown" min="10" max="60" step="5" value="30">
                </div>
                <button id="saveSettingsBtn" class="btn">保存并返回</button>
            </div>
        </div>

        <!-- 3. 皮肤选择面板 -->
        <div id="skinScreen" class="overlay">
            <h2>选择皮肤</h2>
            <div class="menu-panel">
                <p style="color: #aaa; margin-top: 0; margin-bottom: 20px;">敌方坦克固定为红色，请选择其他颜色</p>
                <div class="color-swatches" id="colorSwatchesContainer">
                    <!-- JS 动态生成色块 -->
                </div>
                <button id="saveSkinBtn" class="btn">确认并返回</button>
            </div>
        </div>

        <!-- 4. 游戏结束界面 -->
        <div id="gameOverScreen" class="overlay">
            <h2 id="overlayTitle">游戏结束</h2>
            <p id="overlayScore" style="font-size: 24px; margin-bottom: 20px;">最终得分: 0</p>
            <button id="overlayRestartBtn" class="btn" style="width: 250px;">重新开始</button>
            <button id="backToMenuBtn" class="btn btn-secondary" style="width: 250px;">返回主菜单</button>
        </div>
    </div>

    <div id="ui">
        <span>移动: <span class="key-hint">WASD / 方向键</span></span>
        <span>开火: <span class="key-hint">鼠标左键 / J 键</span></span>
        <span id="scoreDisplay">得分: <span class="highlight">0</span></span>
        <span id="enemyDisplay">剩余敌人: <span class="highlight">0</span></span>
        <button id="uiRestartBtn" class="btn">重新开始</button>
    </div>

    <script>
        // ---- DOM 元素获取 ----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.querySelector('#scoreDisplay .highlight');
        const enemyEl = document.querySelector('#enemyDisplay .highlight');
        
        // 各个屏幕/面板
        const mainMenuScreen = document.getElementById('mainMenuScreen');
        const settingsScreen = document.getElementById('settingsScreen');
        const skinScreen = document.getElementById('skinScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayScore = document.getElementById('overlayScore');
        const colorSwatchesContainer = document.getElementById('colorSwatchesContainer');

        // 按钮
        const goToStartBtn = document.getElementById('goToStartBtn');
        const goToSettingsBtn = document.getElementById('goToSettingsBtn');
        const goToSkinBtn = document.getElementById('goToSkinBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const saveSkinBtn = document.getElementById('saveSkinBtn');
        const overlayRestartBtn = document.getElementById('overlayRestartBtn');
        const backToMenuBtn = document.getElementById('backToMenuBtn');
        const uiRestartBtn = document.getElementById('uiRestartBtn');

        // 设置滑块 DOM
        const sliders = {
            playerSpeed: document.getElementById('playerSpeed'),
            enemySpeed: document.getElementById('enemySpeed'),
            enemyCount: document.getElementById('enemyCount'),
            shootCooldown: document.getElementById('shootCooldown')
        };

        // ---- 核心配置与常量 ----
        const TILE_SIZE = 30;
        const COLS = 20;
        const ROWS = 20;
        const BULLET_SPEED = 1.2; 
        
        // 敌方固定颜色
        const ENEMY_COLOR = '#F44336'; 

        // 玩家的可用皮肤（排除了红色及相近颜色）
        const PLAYER_SKINS = [
            { name: '经典绿', color: '#4CAF50' },
            { name: '天空蓝', color: '#2196F3' },
            { name: '土豪金', color: '#FFC107' },
            { name: '基佬紫', color: '#9C27B0' },
            { name: '青春青', color: '#00BCD4' },
            { name: '雪原白', color: '#E0E0E0' }
        ];

        // 动态游戏配置
        let gameConfig = {
            playerSpeed: 0.4,
            enemySpeed: 0.15,
            enemyCount: 4,
            shootCooldown: 30,
            playerColor: PLAYER_SKINS[0].color // 默认选第一个颜色
        };

        const DIRS = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };

        // ---- 输入控制 ----
        const keys = {
            KeyW: false, KeyA: false, KeyS: false, KeyD: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false,
            KeyJ: false
        };
        let isMouseShooting = false;

        window.addEventListener('keydown', e => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = true;
                if (e.code.startsWith('Arrow')) e.preventDefault(); 
            }
        });
        window.addEventListener('keyup', e => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = false;
                if (e.code.startsWith('Arrow')) e.preventDefault();
            }
        });

        canvas.addEventListener('mousedown', e => {
            if (e.button === 0) { 
                isMouseShooting = true;
                canvas.focus(); 
            }
        });
        canvas.addEventListener('mouseup', e => {
            if (e.button === 0) isMouseShooting = false;
        });
        canvas.addEventListener('mouseleave', () => {
            isMouseShooting = false;
        });

        // ---- 碰撞检测 ----
        function rectIntersect(r1, r2) {
            return !(r2.x >= r1.x + r1.w || r2.x + r2.w <= r1.x || r2.y >= r1.y + r1.h || r2.y + r2.h <= r1.y);
        }

        // ---- 地图数据 ----
        const MAPS = [
            [
                "00000000000000000000", "00110000000000001100", "00110000000000001100", "00110000220000001100",
                "00000000000000000000", "00001100000000110000", "00001100000000110000", "00220000000000000022",
                "00001100000000110000", "00001100000000110000", "00000000000000000000", "00110000220000001100",
                "00110000000000001100", "00110000000000001100", "00000000000000000000", "00000000000000000000",
                "00000000000000000000", "00000000110000000000", "00000000110000000000", "00000000000000000000"
            ],
            [
                "00000000000000000000", "00000000000000000000", "00111100000011110000", "00111100000011110000",
                "00000000000000000000", "00000000220000000000", "00110000000000110000", "00110000000000110000",
                "00000000000000000000", "00002200000022000000", "00000000000000000000", "00111100000011110000",
                "00111100000011110000", "00000000000000000000", "00000000220000000000", "00000000000000000000",
                "00110000000000110000", "00000000110000000000", "00000000110000000000", "00000000000000000000"
            ],
            [
                "00000000000000000000", "00110000000000001100", "00000000000000000000", "00001111000011110000",
                "00001111000011110000", "00000000000000000000", "00220000000000000022", "00110000000000001100",
                "00000000220000000000", "00000000220000000000", "00001100000000110000", "00001100000000110000",
                "00000000000000000000", "00000000000000000000", "00110000220000001100", "00110000000000001100",
                "00000000000000000000", "00000000110000000000", "00000000110000000000", "00000000000000000000"
            ]
        ];

        // ---- 坦克类 ----
        class Tank {
            constructor(x, y, color, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.w = TILE_SIZE - 2;
                this.h = TILE_SIZE - 2;
                this.color = color;
                this.dir = isPlayer ? DIRS.UP : DIRS.DOWN;
                this.isPlayer = isPlayer;
                
                this.speed = isPlayer ? gameConfig.playerSpeed : gameConfig.enemySpeed;
                
                this.cooldown = 0;
                this.aiTimer = 0;
                this.hp = 1;
            }

            draw() {
                if (this.hp <= 0) {
                    ctx.fillStyle = '#333';
                    ctx.fillRect(this.x, this.y, this.w, this.h);
                    ctx.strokeStyle = '#555';
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + this.w, this.y + this.h);
                    ctx.moveTo(this.x + this.w, this.y);
                    ctx.lineTo(this.x, this.y + this.h);
                    ctx.stroke();
                    return; 
                }

                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);

                ctx.fillStyle = '#ccc';
                const barrelLen = 12;
                const barrelWidth = 6;
                let bx = this.x + this.w / 2 - barrelWidth / 2;
                let by = this.y + this.h / 2 - barrelWidth / 2;

                if (this.dir === DIRS.UP) ctx.fillRect(bx, by - barrelLen, barrelWidth, barrelLen);
                if (this.dir === DIRS.DOWN) ctx.fillRect(bx, by, barrelWidth, barrelLen);
                if (this.dir === DIRS.LEFT) ctx.fillRect(bx - barrelLen, by, barrelLen, barrelWidth);
                if (this.dir === DIRS.RIGHT) ctx.fillRect(bx, by, barrelLen, barrelWidth);
            }

            update() {
                if (this.hp <= 0) return;
                if (this.cooldown > 0) this.cooldown--;

                let dx = 0, dy = 0;
                let moving = false;

                if (this.isPlayer) {
                    if (keys.KeyW || keys.ArrowUp) { this.dir = DIRS.UP; dy = -this.speed; moving = true; }
                    else if (keys.KeyS || keys.ArrowDown) { this.dir = DIRS.DOWN; dy = this.speed; moving = true; }
                    else if (keys.KeyA || keys.ArrowLeft) { this.dir = DIRS.LEFT; dx = -this.speed; moving = true; }
                    else if (keys.KeyD || keys.ArrowRight) { this.dir = DIRS.RIGHT; dx = this.speed; moving = true; }

                    if ((isMouseShooting || keys.KeyJ) && this.cooldown === 0) {
                        this.shoot();
                    }
                } else {
                    this.aiTimer--;
                    if (this.aiTimer <= 0) {
                        this.dir = Math.floor(Math.random() * 4);
                        this.aiTimer = 60 + Math.random() * 100;
                        if (Math.random() > 0.5) this.shoot();
                    }
                    if (this.dir === DIRS.UP) dy = -this.speed;
                    if (this.dir === DIRS.DOWN) dy = this.speed;
                    if (this.dir === DIRS.LEFT) dx = -this.speed;
                    if (this.dir === DIRS.RIGHT) dx = this.speed;
                    moving = true;
                }

                if (moving) {
                    let nextX = this.x + dx;
                    let nextY = this.y + dy;

                    if (nextX < 0) nextX = 0;
                    if (nextX + this.w > canvas.width) nextX = canvas.width - this.w;
                    if (nextY < 0) nextY = 0;
                    if (nextY + this.h > canvas.height) nextY = canvas.height - this.h;

                    let collided = false;
                    for (let wall of walls) {
                        if (rectIntersect({x: nextX, y: nextY, w: this.w, h: this.h}, wall)) {
                            collided = true;
                            break;
                        }
                    }
                    if (rectIntersect({x: nextX, y: nextY, w: this.w, h: this.h}, base)) {
                        collided = true;
                    }

                    if (!collided) {
                        this.x = nextX;
                        this.y = nextY;
                    } else if (!this.isPlayer) {
                        this.dir = Math.floor(Math.random() * 4);
                        this.aiTimer = 30;
                    }
                }
            }

            shoot() {
                this.cooldown = this.isPlayer ? gameConfig.shootCooldown : Math.max(gameConfig.shootCooldown, 40);
                let bx = this.x + this.w / 2 - 3;
                let by = this.y + this.h / 2 - 3;
                bullets.push(new Bullet(bx, by, this.dir, this.isPlayer));
            }
        }

        // ---- 子弹类 ----
        class Bullet {
            constructor(x, y, dir, isPlayer) {
                this.x = x;
                this.y = y;
                this.w = 6;
                this.h = 6;
                this.dir = dir;
                this.isPlayer = isPlayer;
                this.dead = false;
                this.speed = isPlayer ? BULLET_SPEED : BULLET_SPEED * 0.5; 
            }

            update() {
                if (this.dir === DIRS.UP) this.y -= this.speed;
                if (this.dir === DIRS.DOWN) this.y += this.speed;
                if (this.dir === DIRS.LEFT) this.x -= this.speed;
                if (this.dir === DIRS.RIGHT) this.x += this.speed;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.dead = true;
                }
            }

            draw() {
                ctx.fillStyle = this.isPlayer ? '#00ffff' : '#ff4444';
                ctx.beginPath();
                ctx.arc(this.x + 3, this.y + 3, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = this.isPlayer ? 'rgba(0, 255, 255, 0.3)' : 'rgba(255, 68, 68, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x + 3, this.y + 3, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ---- 游戏状态变量 ----
        let player;
        let enemies = [];
        let bullets = [];
        let walls = [];
        let base = { x: 9 * TILE_SIZE, y: 19 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE };
        let gameOver = true; 
        let score = 0;

        // ---- 初始化游戏 ----
        function initGame() {
            for (let k in keys) keys[k] = false;
            isMouseShooting = false;
            enemies = [];
            bullets = [];
            walls = [];
            gameOver = false;
            score = 0;
            scoreEl.textContent = '0';

            // 应用玩家选择的皮肤
            player = new Tank(9 * TILE_SIZE, 18 * TILE_SIZE, gameConfig.playerColor, true);

            const mapData = MAPS[Math.floor(Math.random() * MAPS.length)];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let tile = mapData[r][c];
                    if (tile === '1') {
                        walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'brick' });
                    } else if (tile === '2') {
                        walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'steel' });
                    }
                }
            }

            walls.push({ x: 8 * TILE_SIZE, y: 18 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'brick' });
            walls.push({ x: 11 * TILE_SIZE, y: 18 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'brick' });

            const maxSpawns = [
                {x: 0, y: 0}, {x: 9 * TILE_SIZE, y: 0}, {x: 18 * TILE_SIZE, y: 0}, 
                {x: 0, y: 5 * TILE_SIZE}, {x: 18 * TILE_SIZE, y: 5 * TILE_SIZE},
                {x: 9 * TILE_SIZE, y: 5 * TILE_SIZE}, {x: 0, y: 10 * TILE_SIZE}, {x: 18 * TILE_SIZE, y: 10 * TILE_SIZE}
            ];
            for (let i = 0; i < gameConfig.enemyCount; i++) {
                let spawn = maxSpawns[i % maxSpawns.length];
                // 敌人强制使用红色 ENEMY_COLOR
                enemies.push(new Tank(spawn.x, spawn.y, ENEMY_COLOR, false));
            }

            updateEnemyUI();
            setTimeout(() => canvas.focus(), 50);
        }

        function updateEnemyUI() {
            const alive = enemies.filter(e => e.hp > 0).length;
            enemyEl.textContent = alive;
        }

        function endGame(isWin) {
            gameOver = true;
            overlayTitle.textContent = isWin ? '胜 利 !' : '游戏结束';
            overlayTitle.style.color = isWin ? '#4CAF50' : '#F44336';
            overlayScore.textContent = `最终得分: ${score}`;
            gameOverScreen.classList.add('active');
        }

        // ---- 渲染循环 ----
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (gameOver) return;

            ctx.fillStyle = '#FFD700'; 
            ctx.fillRect(base.x, base.y, base.w, base.h);
            ctx.fillStyle = '#000';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🦅', base.x + TILE_SIZE, base.y + 22);

            for (let wall of walls) {
                if (wall.type === 'brick') {
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                    ctx.strokeStyle = '#5c2e0a';
                    ctx.strokeRect(wall.x + 2, wall.y + 2, wall.w - 4, wall.h - 4);
                } else {
                    ctx.fillStyle = '#7a7a7a';
                    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                    ctx.strokeStyle = '#444';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(wall.x + 2, wall.y + 2, wall.w - 4, wall.h - 4);
                    ctx.lineWidth = 1;
                }
            }

            if (player.hp > 0) player.draw();
            for (let enemy of enemies) enemy.draw();
            for (let bullet of bullets) bullet.draw();
        }

        // ---- 逻辑更新循环 ----
        function update() {
            if (gameOver) return;

            if (player.hp > 0) player.update();
            for (let enemy of enemies) enemy.update();

            for (let i = bullets.length - 1; i >= 0; i--) {
                let bullet = bullets[i];
                bullet.update();

                for (let j = walls.length - 1; j >= 0; j--) {
                    let wall = walls[j];
                    if (rectIntersect(bullet, wall)) {
                        bullet.dead = true;
                        if (wall.type === 'brick') walls.splice(j, 1);
                        break;
                    }
                }

                if (rectIntersect(bullet, base)) {
                    bullet.dead = true;
                    endGame(false);
                }

                if (bullet.isPlayer) {
                    for (let enemy of enemies) {
                        if (enemy.hp > 0 && rectIntersect(bullet, enemy)) {
                            bullet.dead = true;
                            enemy.hp = 0;
                            score += 100;
                            scoreEl.textContent = score;
                            updateEnemyUI();
                            break;
                        }
                    }
                } else {
                    if (player.hp > 0 && rectIntersect(bullet, player)) {
                        bullet.dead = true;
                        player.hp = 0;
                        endGame(false);
                    }
                }

                if (bullet.dead) bullets.splice(i, 1);
            }

            if (enemies.every(e => e.hp === 0)) {
                endGame(true);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---- UI 交互事件 ----
        
        // 1. 绑定设置滑块
        Object.keys(sliders).forEach(key => {
            sliders[key].addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                gameConfig[key] = val;
                document.getElementById(`val${key.charAt(0).toUpperCase() + key.slice(1)}`).textContent = val;
            });
        });

        // 2. 动态生成皮肤色块
        function renderSkinSwatches() {
            colorSwatchesContainer.innerHTML = '';
            PLAYER_SKINS.forEach(skin => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                if (gameConfig.playerColor === skin.color) {
                    swatch.classList.add('selected');
                }
                swatch.style.backgroundColor = skin.color;
                swatch.title = skin.name;
                
                swatch.addEventListener('click', () => {
                    gameConfig.playerColor = skin.color;
                    renderSkinSwatches(); // 重新渲染以更新选中状态
                });
                
                colorSwatchesContainer.appendChild(swatch);
            });
        }

        // 3. 界面导航逻辑
        goToStartBtn.addEventListener('click', () => {
            mainMenuScreen.classList.remove('active');
            initGame();
        });

        goToSettingsBtn.addEventListener('click', () => {
            mainMenuScreen.classList.remove('active');
            settingsScreen.classList.add('active');
        });

        saveSettingsBtn.addEventListener('click', () => {
            settingsScreen.classList.remove('active');
            mainMenuScreen.classList.add('active');
        });

        goToSkinBtn.addEventListener('click', () => {
            mainMenuScreen.classList.remove('active');
            renderSkinSwatches(); // 每次打开刷新当前选中状态
            skinScreen.classList.add('active');
        });

        saveSkinBtn.addEventListener('click', () => {
            skinScreen.classList.remove('active');
            mainMenuScreen.classList.add('active');
        });

        uiRestartBtn.addEventListener('click', initGame);
        overlayRestartBtn.addEventListener('click', () => {
            gameOverScreen.classList.remove('active');
            initGame();
        });

        backToMenuBtn.addEventListener('click', () => {
            gameOverScreen.classList.remove('active');
            mainMenuScreen.classList.add('active');
        });

        // 初始化渲染色块，并启动游戏循环
        renderSkinSwatches();
        gameLoop();
    </script>
</body>
</html>
