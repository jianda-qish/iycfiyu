       <!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - 慢动作版</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .game-wrapper {
            position: relative;
        }
        canvas {
            background-color: #000;
            border: 4px solid #555;
            box-shadow: 0 0 25px rgba(0,150,255,0.3);
            display: block;
        }
        #ui {
            margin-top: 15px;
            font-size: 18px;
            display: flex;
            gap: 20px;
            align-items: center;
            background: #333;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #555;
        }
        .highlight { color: #4CAF50; font-weight: bold; }
        
        #restartBtn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }
        #restartBtn:hover { background-color: #45a049; }
        #restartBtn:active { background-color: #3d8b40; }

        /* 游戏结束/胜利 悬浮层 */
        #gameOverlay {
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px; /* 适应边框 */
            background-color: rgba(0, 0, 0, 0.85);
            display: none; /* 默认隐藏 */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #gameOverlay h2 {
            font-size: 50px;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        }
        #gameOverlay p {
            font-size: 24px;
            margin-bottom: 30px;
        }
        #overlayRestartBtn {
            background-color: #2196F3;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 22px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.2s;
        }
        #overlayRestartBtn:hover { background-color: #1976D2; }
        #overlayRestartBtn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <!-- 游戏结束悬浮层 -->
        <div id="gameOverlay">
            <h2 id="overlayTitle">游戏结束</h2>
            <p id="overlayScore">最终得分: 0</p>
            <button id="overlayRestartBtn">重新开始</button>
        </div>
    </div>

    <div id="ui">
        <span>WASD / 方向键 移动 | 空格键 开火</span>
        <span id="scoreDisplay">得分: <span class="highlight">0</span></span>
        <span id="enemyDisplay">剩余敌人: <span class="highlight">4</span></span>
        <button id="restartBtn">重新开始</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.querySelector('#scoreDisplay .highlight');
        const enemyEl = document.querySelector('#enemyDisplay .highlight');
        
        // 按钮和悬浮层
        const topRestartBtn = document.getElementById('restartBtn');
        const overlayRestartBtn = document.getElementById('overlayRestartBtn');
        const gameOverlay = document.getElementById('gameOverlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayScore = document.getElementById('overlayScore');

        // ---- 核心速度配置 ----
        const TILE_SIZE = 30;
        const COLS = 20;
        const ROWS = 20;
        const TANK_SPEED = 1;     // 原为2，减半
        const BULLET_SPEED = 3;   // 原为6，减半
        const SHOOT_COOLDOWN = 12; // 0.2秒 (60帧 * 0.2 = 12帧)

        const DIRS = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };

        const keys = {
            w: false, a: false, s: false, d: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false,
            ' ': false
        };

        window.addEventListener('keydown', e => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = true;
                e.preventDefault(); 
            }
        });
        window.addEventListener('keyup', e => {
            if (keys.hasOwnProperty(e.key)) {
                keys[e.key] = false;
                e.preventDefault();
            }
        });

        function rectIntersect(r1, r2) {
            return !(r2.x >= r1.x + r1.w || r2.x + r2.w <= r1.x || r2.y >= r1.y + r1.h || r2.y + r2.h <= r1.y);
        }

        const MAPS = [
            [
                "00000000000000000000", "00110000000000001100", "00110000000000001100", "00110000220000001100",
                "00000000000000000000", "00001100000000110000", "00001100000000110000", "00220000000000000022",
                "00001100000000110000", "00001100000000110000", "00000000000000000000", "00110000220000001100",
                "00110000000000001100", "00110000000000001100", "00000000000000000000", "00000000000000000000",
                "00000000000000000000", "00000000110000000000", "00000000110000000000", "00000000000000000000"
            ],
            [
                "00000000000000000000", "00000000000000000000", "00111100000011110000", "00111100000011110000",
                "00000000000000000000", "00000000220000000000", "00110000000000110000", "00110000000000110000",
                "00000000000000000000", "00002200000022000000", "00000000000000000000", "00111100000011110000",
                "00111100000011110000", "00000000000000000000", "00000000220000000000", "00000000000000000000",
                "00110000000000110000", "00000000110000000000", "00000000110000000000", "00000000000000000000"
            ],
            [
                "00000000000000000000", "00110000000000001100", "00000000000000000000", "00001111000011110000",
                "00001111000011110000", "00000000000000000000", "00220000000000000022", "00110000000000001100",
                "00000000220000000000", "00000000220000000000", "00001100000000110000", "00001100000000110000",
                "00000000000000000000", "00000000000000000000", "00110000220000001100", "00110000000000001100",
                "00000000000000000000", "00000000110000000000", "00000000110000000000", "00000000000000000000"
            ]
        ];

        class Tank {
            constructor(x, y, color, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.w = TILE_SIZE - 2;
                this.h = TILE_SIZE - 2;
                this.color = color;
                this.dir = isPlayer ? DIRS.UP : DIRS.DOWN;
                this.isPlayer = isPlayer;
                // 速度调整：玩家等于基础速度，敌人等于基础速度的40% (比原版更慢)
                this.speed = isPlayer ? TANK_SPEED : TANK_SPEED * 0.4;
                this.cooldown = 0;
                this.aiTimer = 0;
                this.hp = 1;
            }

            draw() {
                if (this.hp <= 0) {
                    ctx.fillStyle = '#333';
                    ctx.fillRect(this.x, this.y, this.w, this.h);
                    ctx.strokeStyle = '#555';
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(this.x + this.w, this.y + this.h);
                    ctx.moveTo(this.x + this.w, this.y);
                    ctx.lineTo(this.x, this.y + this.h);
                    ctx.stroke();
                    return; 
                }

                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);

                ctx.fillStyle = '#ccc';
                const barrelLen = 12;
                const barrelWidth = 6;
                let bx = this.x + this.w / 2 - barrelWidth / 2;
                let by = this.y + this.h / 2 - barrelWidth / 2;

                if (this.dir === DIRS.UP) ctx.fillRect(bx, by - barrelLen, barrelWidth, barrelLen);
                if (this.dir === DIRS.DOWN) ctx.fillRect(bx, by, barrelWidth, barrelLen);
                if (this.dir === DIRS.LEFT) ctx.fillRect(bx - barrelLen, by, barrelLen, barrelWidth);
                if (this.dir === DIRS.RIGHT) ctx.fillRect(bx, by, barrelLen, barrelWidth);
            }

            update() {
                if (this.hp <= 0) return;
                if (this.cooldown > 0) this.cooldown--;

                let dx = 0, dy = 0;
                let moving = false;

                if (this.isPlayer) {
                    if (keys.w || keys.ArrowUp) { this.dir = DIRS.UP; dy = -this.speed; moving = true; }
                    else if (keys.s || keys.ArrowDown) { this.dir = DIRS.DOWN; dy = this.speed; moving = true; }
                    else if (keys.a || keys.ArrowLeft) { this.dir = DIRS.LEFT; dx = -this.speed; moving = true; }
                    else if (keys.d || keys.ArrowRight) { this.dir = DIRS.RIGHT; dx = this.speed; moving = true; }

                    if (keys[' '] && this.cooldown === 0) {
                        this.shoot();
                    }
                } else {
                    this.aiTimer--;
                    if (this.aiTimer <= 0) {
                        this.dir = Math.floor(Math.random() * 4);
                        this.aiTimer = 60 + Math.random() * 100;
                        if (Math.random() > 0.5) this.shoot();
                    }
                    if (this.dir === DIRS.UP) dy = -this.speed;
                    if (this.dir === DIRS.DOWN) dy = this.speed;
                    if (this.dir === DIRS.LEFT) dx = -this.speed;
                    if (this.dir === DIRS.RIGHT) dx = this.speed;
                    moving = true;
                }

                if (moving) {
                    let nextX = this.x + dx;
                    let nextY = this.y + dy;

                    if (nextX < 0) nextX = 0;
                    if (nextX + this.w > canvas.width) nextX = canvas.width - this.w;
                    if (nextY < 0) nextY = 0;
                    if (nextY + this.h > canvas.height) nextY = canvas.height - this.h;

                    let collided = false;
                    for (let wall of walls) {
                        if (rectIntersect({x: nextX, y: nextY, w: this.w, h: this.h}, wall)) {
                            collided = true;
                            break;
                        }
                    }
                    if (rectIntersect({x: nextX, y: nextY, w: this.w, h: this.h}, base)) {
                        collided = true;
                    }

                    if (!collided) {
                        this.x = nextX;
                        this.y = nextY;
                    } else if (!this.isPlayer) {
                        this.dir = Math.floor(Math.random() * 4);
                        this.aiTimer = 30;
                    }
                }
            }

            shoot() {
                // 射击间隔设置为 0.2s (12帧)
                this.cooldown = SHOOT_COOLDOWN; 
                let bx = this.x + this.w / 2 - 3;
                let by = this.y + this.h / 2 - 3;
                bullets.push(new Bullet(bx, by, this.dir, this.isPlayer));
            }
        }

        class Bullet {
            constructor(x, y, dir, isPlayer) {
                this.x = x;
                this.y = y;
                this.w = 6;
                this.h = 6;
                this.dir = dir;
                this.isPlayer = isPlayer;
                this.dead = false;
                // 玩家炮弹使用减速后的基础速度，敌人炮弹再慢一点（乘0.6）
                this.speed = isPlayer ? BULLET_SPEED : BULLET_SPEED * 0.6; 
            }

            update() {
                if (this.dir === DIRS.UP) this.y -= this.speed;
                if (this.dir === DIRS.DOWN) this.y += this.speed;
                if (this.dir === DIRS.LEFT) this.x -= this.speed;
                if (this.dir === DIRS.RIGHT) this.x += this.speed;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.dead = true;
                }
            }

            draw() {
                ctx.fillStyle = this.isPlayer ? '#00ffff' : '#ff4444';
                ctx.beginPath();
                ctx.arc(this.x + 3, this.y + 3, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = this.isPlayer ? 'rgba(0, 255, 255, 0.3)' : 'rgba(255, 68, 68, 0.3)';
                ctx.beginPath();
                ctx.arc(this.x + 3, this.y + 3, 6, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        let player;
        let enemies = [];
        let bullets = [];
        let walls = [];
        let base = { x: 9 * TILE_SIZE, y: 19 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE };
        let gameOver = false;
        let win = false;
        let score = 0;

        function initGame() {
            // 隐藏结束悬浮层
            gameOverlay.style.display = 'none';

            player = new Tank(9 * TILE_SIZE, 18 * TILE_SIZE, '#4CAF50', true);
            enemies = [];
            bullets = [];
            walls = [];
            gameOver = false;
            win = false;
            score = 0;
            scoreEl.textContent = '0';

            const mapData = MAPS[Math.floor(Math.random() * MAPS.length)];
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let tile = mapData[r][c];
                    if (tile === '1') {
                        walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'brick' });
                    } else if (tile === '2') {
                        walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'steel' });
                    }
                }
            }

            walls.push({ x: 8 * TILE_SIZE, y: 18 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'brick' });
            walls.push({ x: 11 * TILE_SIZE, y: 18 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'brick' });

            const enemySpawns = [
                {x: 0, y: 0}, {x: 9 * TILE_SIZE, y: 0}, 
                {x: 18 * TILE_SIZE, y: 0}, {x: 18 * TILE_SIZE, y: 5 * TILE_SIZE}
            ];
            for (let spawn of enemySpawns) {
                enemies.push(new Tank(spawn.x, spawn.y, '#F44336', false));
            }
            updateEnemyUI();
        }

        function updateEnemyUI() {
            const alive = enemies.filter(e => e.hp > 0).length;
            enemyEl.textContent = alive;
        }

        function endGame(isWin) {
            gameOver = true;
            win = isWin;
            
            // 更新悬浮层内容并显示
            overlayTitle.textContent = isWin ? '胜 利 !' : '游戏结束';
            overlayTitle.style.color = isWin ? '#4CAF50' : '#F44336';
            overlayScore.textContent = `最终得分: ${score}`;
            gameOverlay.style.display = 'flex';
        }

        // 绑定两个重新开始按钮的事件
        topRestartBtn.addEventListener('click', initGame);
        overlayRestartBtn.addEventListener('click', initGame);

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FFD700'; 
            ctx.fillRect(base.x, base.y, base.w, base.h);
            ctx.fillStyle = '#000';
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🦅', base.x + TILE_SIZE, base.y + 22);

            for (let wall of walls) {
                if (wall.type === 'brick') {
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                    ctx.strokeStyle = '#5c2e0a';
                    ctx.strokeRect(wall.x + 2, wall.y + 2, wall.w - 4, wall.h - 4);
                } else {
                    ctx.fillStyle = '#7a7a7a';
                    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                    ctx.strokeStyle = '#444';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(wall.x + 2, wall.y + 2, wall.w - 4, wall.h - 4);
                    ctx.lineWidth = 1;
                }
            }

            if (player.hp > 0) player.draw();
            for (let enemy of enemies) enemy.draw();
            for (let bullet of bullets) bullet.draw();
        }

        function update() {
            if (gameOver) return;

            if (player.hp > 0) player.update();
            for (let enemy of enemies) enemy.update();

            for (let i = bullets.length - 1; i >= 0; i--) {
                let bullet = bullets[i];
                bullet.update();

                for (let j = walls.length - 1; j >= 0; j--) {
                    let wall = walls[j];
                    if (rectIntersect(bullet, wall)) {
                        bullet.dead = true;
                        if (wall.type === 'brick') walls.splice(j, 1);
                        break;
                    }
                }

                if (rectIntersect(bullet, base)) {
                    bullet.dead = true;
                    endGame(false);
                }

                if (bullet.isPlayer) {
                    for (let enemy of enemies) {
                        if (enemy.hp > 0 && rectIntersect(bullet, enemy)) {
                            bullet.dead = true;
                            enemy.hp = 0;
                            score += 100;
                            scoreEl.textContent = score;
                            updateEnemyUI();
                            break;
                        }
                    }
                } else {
                    if (player.hp > 0 && rectIntersect(bullet, player)) {
                        bullet.dead = true;
                        player.hp = 0;
                        endGame(false);
                    }
                }

                if (bullet.dead) bullets.splice(i, 1);
            }

            if (enemies.every(e => e.hp === 0)) {
                endGame(true);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        initGame();
        gameLoop();
    </script>
</body>
</html>
