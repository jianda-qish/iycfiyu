<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经典扫雷</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #333;
        }
        .game-container {
            background-color: #c0c0c0;
            padding: 10px;
            border: 4px solid #fff;
            border-right-color: #7b7b7b;
            border-bottom-color: #7b7b7b;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #c0c0c0;
            padding: 5px;
            margin-bottom: 10px;
            border: 2px solid #7b7b7b;
            border-right-color: #fff;
            border-bottom-color: #fff;
        }
        .display {
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            padding: 2px 5px;
            border: 1px solid #7b7b7b;
        }
        #reset {
            width: 36px;
            height: 36px;
            font-size: 20px;
            background-color: #c0c0c0;
            border: 2px solid #fff;
            border-right-color: #7b7b7b;
            border-bottom-color: #7b7b7b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #reset:active {
            border: 2px solid #7b7b7b;
            border-right-color: #fff;
            border-bottom-color: #fff;
        }
        #board {
            display: grid;
            grid-template-columns: repeat(9, 30px);
            grid-template-rows: repeat(9, 30px);
            gap: 1px;
            background-color: #7b7b7b;
            border: 2px solid #7b7b7b;
        }
        .cell {
            width: 30px;
            height: 30px;
            background-color: #c0c0c0;
            border: 2px solid #fff;
            border-right-color: #7b7b7b;
            border-bottom-color: #7b7b7b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            user-select: none;
        }
        .cell.revealed {
            border: 1px solid #7b7b7b;
            background-color: #c0c0c0;
            cursor: default;
        }
        .cell.mine {
            background-color: red;
        }
        /* 数字颜色 */
        .cell[data-num="1"] { color: blue; }
        .cell[data-num="2"] { color: green; }
        .cell[data-num="3"] { color: red; }
        .cell[data-num="4"] { color: darkblue; }
        .cell[data-num="5"] { color: brown; }
        .cell[data-num="6"] { color: teal; }
        .cell[data-num="7"] { color: black; }
        .cell[data-num="8"] { color: gray; }
    </style>
</head>
<body>

    <h1>💣 扫雷 💣</h1>
    <div class="game-container">
        <div class="header">
            <div id="mine-count" class="display">010</div>
            <button id="reset">🙂</button>
            <div id="timer" class="display">000</div>
        </div>
        <div id="board"></div>
    </div>

    <script>
        const ROWS = 9;
        const COLS = 9;
        const MINES = 10;

        let board = [];
        let gameOver = false;
        let flags = 0;
        let revealedCount = 0;
        let timerInterval = null;
        let time = 0;

        const boardEl = document.getElementById('board');
        const mineCountEl = document.getElementById('mine-count');
        const timerEl = document.getElementById('timer');
        const resetBtn = document.getElementById('reset');

        // 初始化游戏
        function initGame() {
            board = [];
            gameOver = false;
            flags = 0;
            revealedCount = 0;
            time = 0;
            clearInterval(timerInterval);
            timerEl.textContent = '000';
            resetBtn.textContent = '🙂';
            updateMineCount();
            boardEl.innerHTML = '';

            // 生成空数据
            for (let r = 0; r < ROWS; r++) {
                const row = [];
                for (let c = 0; c < COLS; c++) {
                    row.push({
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0,
                        element: null
                    });
                }
                board.push(row);
            }

            // 随机布雷
            let minesPlanted = 0;
            while (minesPlanted < MINES) {
                const r = Math.floor(Math.random() * ROWS);
                const c = Math.floor(Math.random() * COLS);
                if (!board[r][c].isMine) {
                    board[r][c].isMine = true;
                    minesPlanted++;
                }
            }

            // 计算周围地雷数量并渲染DOM
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!board[r][c].isMine) {
                        board[r][c].neighborMines = countNeighborMines(r, c);
                    }
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.addEventListener('click', handleLeftClick);
                    cell.addEventListener('contextmenu', handleRightClick);
                    boardEl.appendChild(cell);
                    board[r][c].element = cell;
                }
            }
        }

        // 计算周边地雷
        function countNeighborMines(row, col) {
            let count = 0;
            for (let r = -1; r <= 1; r++) {
                for (let c = -1; c <= 1; c++) {
                    if (r === 0 && c === 0) continue;
                    const newRow = row + r;
                    const newCol = col + c;
                    if (newRow >= 0 && newRow < ROWS && newCol >= 0 && newCol < COLS) {
                        if (board[newRow][newCol].isMine) {
                            count++;
                        }
                    }
                }
            }
            return count;
        }

        // 左键点击
        function handleLeftClick(e) {
            if (gameOver) return;
            const r = parseInt(e.target.dataset.r);
            const c = parseInt(e.target.dataset.c);
            const cellData = board[r][c];

            if (cellData.isFlagged || cellData.isRevealed) return;

            if (!timerInterval) startTimer();

            if (cellData.isMine) {
                // 踩雷
                gameOver = true;
                e.target.classList.add('mine');
                e.target.textContent = '💣';
                revealAllMines();
                resetBtn.textContent = '😵';
                clearInterval(timerInterval);
            } else {
                // 安全
                revealCell(r, c);
                checkWin();
            }
        }

        // 右键点击（插旗）
        function handleRightClick(e) {
            e.preventDefault();
            if (gameOver) return;
            const r = parseInt(e.target.dataset.r);
            const c = parseInt(e.target.dataset.c);
            const cellData = board[r][c];

            if (cellData.isRevealed) return;

            if (!cellData.isFlagged) {
                if (flags < MINES) {
                    cellData.isFlagged = true;
                    e.target.textContent = '🚩';
                    flags++;
                }
            } else {
                cellData.isFlagged = false;
                e.target.textContent = '';
                flags--;
            }
            updateMineCount();
        }

        // 展开格子（递归处理空白区域）
        function revealCell(row, col) {
            if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
            const cellData = board[row][col];
            
            if (cellData.isRevealed || cellData.isFlagged || cellData.isMine) return;

            cellData.isRevealed = true;
            revealedCount++;
            const el = cellData.element;
            el.classList.add('revealed');
            
            if (cellData.neighborMines > 0) {
                el.textContent = cellData.neighborMines;
                el.dataset.num = cellData.neighborMines;
            } else {
                // 如果周围没雷，递归展开周围格子
                for (let r = -1; r <= 1; r++) {
                    for (let c = -1; c <= 1; c++) {
                        revealCell(row + r, col + c);
                    }
                }
            }
        }

        // 游戏结束时显示所有地雷
        function revealAllMines() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c].isMine && !board[r][c].isFlagged) {
                        board[r][c].element.classList.add('revealed');
                        board[r][c].element.textContent = '💣';
                    }
                }
            }
        }

        // 检查是否胜利
        function checkWin() {
            if (revealedCount === ROWS * COLS - MINES) {
                gameOver = true;
                resetBtn.textContent = '😎';
                clearInterval(timerInterval);
                // 把剩余的地雷自动插上旗子
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c].isMine && !board[r][c].isFlagged) {
                            board[r][c].element.textContent = '🚩';
                        }
                    }
                }
                updateMineCount(0);
            }
        }

        // 更新雷数显示
        function updateMineCount(override) {
            const remaining = override !== undefined ? override : MINES - flags;
            mineCountEl.textContent = remaining.toString().padStart(3, '0');
        }

        // 计时器
        function startTimer() {
            timerInterval = setInterval(() => {
                time++;
                if (time > 999) time = 999;
                timerEl.textContent = time.toString().padStart(3, '0');
            }, 1000);
        }

        // 重新开始按钮
        resetBtn.addEventListener('click', initGame);

        // 开始游戏
        initGame();
    </script>
</body>
</html>
