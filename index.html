<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战 - 高清重置版</title>
    <!-- 引入科技感字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e5ff;
            --primary-hover: #00b8cc;
            --accent: #ff0055;
            --bg-color: #0a0a10;
            --panel-bg: rgba(20, 25, 40, 0.75);
            --text-color: #e0e0e0;
            --border-color: rgba(255, 255, 255, 0.1);
            --font-heading: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1a2030 0%, #050508 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-color);
            font-family: var(--font-body);
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            /* 画布调整为 800x800 */
            width: 800px;
            height: 800px;
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.15), inset 0 0 20px rgba(0,0,0,0.8);
        }

        canvas {
            background-color: #0d1117;
            border: 2px solid rgba(0, 229, 255, 0.3);
            border-radius: 12px;
            display: block;
            outline: none;
            cursor: crosshair;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
        }

        #ui {
            margin-top: 20px;
            font-size: 20px;
            font-family: var(--font-heading);
            display: flex;
            gap: 30px;
            align-items: center;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 12px 30px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .highlight { color: var(--primary); text-shadow: 0 0 10px rgba(0, 229, 255, 0.5); }
        .key-hint { color: #ffaa00; font-weight: 600; }

        .overlay {
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            background: rgba(5, 10, 20, 0.85);
            backdrop-filter: blur(8px);
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 10px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .overlay.active { display: flex; }

        .overlay h2 {
            font-family: var(--font-heading);
            font-size: 56px;
            margin: 0 0 25px 0;
            color: #fff;
            text-shadow: 0 0 20px var(--primary);
            letter-spacing: 2px;
        }

        .menu-panel {
            background: var(--panel-bg);
            padding: 40px 50px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            width: 380px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            text-align: center;
        }

        .main-menu-btn {
            display: block;
            width: 100%;
            margin-bottom: 18px;
            padding: 16px;
            font-size: 22px;
        }
        .main-menu-btn:last-child { margin-bottom: 0; }

        .setting-item {
            margin-bottom: 22px;
            text-align: left;
        }

        .setting-item label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 18px;
            color: #ccc;
            font-weight: 600;
        }

        .setting-item .value-display {
            color: var(--primary);
            font-weight: 700;
            font-family: var(--font-heading);
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 3px;
            border: 1px solid #333;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--primary);
            margin-top: -8px;
            box-shadow: 0 0 10px var(--primary);
            transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .color-swatches {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .color-swatch {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid rgba(255,255,255,0.1);
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .color-swatch:hover { transform: scale(1.15); }
        .color-swatch.selected {
            border-color: #fff;
            transform: scale(1.15);
            box-shadow: 0 0 15px currentColor;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, #007799 100%);
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-family: var(--font-heading);
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.2);
            letter-spacing: 1px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #00b8cc 0%, #005566 100%);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
            transform: translateY(-2px);
        }
        .btn:active { transform: translateY(0); }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            color: var(--primary);
        }

        #uiRestartBtn {
            width: auto;
            margin-top: 0;
            padding: 10px 20px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <!-- 分辨率提升至 800x800 -->
        <canvas id="gameCanvas" width="800" height="800" tabindex="0"></canvas>
        
        <div id="mainMenuScreen" class="overlay active">
            <h2>TANK COMBAT</h2>
            <div class="menu-panel">
                <button id="goToStartBtn" class="btn main-menu-btn">开始行动</button>
                <button id="goToSettingsBtn" class="btn main-menu-btn btn-secondary">系统设置</button>
                <button id="goToSkinBtn" class="btn main-menu-btn btn-secondary">涂装变更</button>
            </div>
        </div>

        <div id="settingsScreen" class="overlay">
            <h2>系统设置</h2>
            <div class="menu-panel">
                <div class="setting-item">
                    <label>移动速度 <span id="valPlayerSpeed" class="value-display">0.6</span></label>
                    <input type="range" id="playerSpeed" min="0.2" max="3.0" step="0.1" value="0.6">
                </div>
                <div class="setting-item">
                    <label>敌方移速 <span id="valEnemySpeed" class="value-display">0.25</span></label>
                    <input type="range" id="enemySpeed" min="0.1" max="1.5" step="0.05" value="0.25">
                </div>
                <div class="setting-item">
                    <label>敌方数量 <span id="valEnemyCount" class="value-display">4</span></label>
                    <input type="range" id="enemyCount" min="1" max="8" step="1" value="4">
                </div>
                <div class="setting-item">
                    <label>武器冷却 <span id="valShootCooldown" class="value-display">30</span></label>
                    <input type="range" id="shootCooldown" min="10" max="60" step="5" value="30">
                </div>
                <button id="saveSettingsBtn" class="btn">保存并返回</button>
            </div>
        </div>

        <div id="skinScreen" class="overlay">
            <h2>涂装变更</h2>
            <div class="menu-panel">
                <p style="color: #aaa; margin-top: 0; margin-bottom: 20px; font-size: 16px;">敌方部队固定为红色，请选择我方专属涂装</p>
                <div class="color-swatches" id="colorSwatchesContainer"></div>
                <button id="saveSkinBtn" class="btn">确认并返回</button>
            </div>
        </div>

        <div id="gameOverScreen" class="overlay">
            <h2 id="overlayTitle">游戏结束</h2>
            <p id="overlayScore" style="font-size: 26px; margin-bottom: 30px; font-family: var(--font-heading);">最终得分: 0</p>
            <button id="overlayRestartBtn" class="btn" style="width: 250px; margin-bottom: 15px;">重新出击</button>
            <button id="backToMenuBtn" class="btn btn-secondary" style="width: 250px;">返回主菜单</button>
        </div>
    </div>

    <div id="ui">
        <span>移动: <span class="key-hint">WASD / 方向键</span></span>
        <span>开火: <span class="key-hint">鼠标左键 / J 键</span></span>
        <span id="scoreDisplay">得分: <span class="highlight">0</span></span>
        <span id="enemyDisplay">剩余敌人: <span class="highlight">0</span></span>
        <button id="uiRestartBtn" class="btn">重置</button>
    </div>

    <script>
        // ---- DOM 元素获取 ----
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.querySelector('#scoreDisplay .highlight');
        const enemyEl = document.querySelector('#enemyDisplay .highlight');
        
        const mainMenuScreen = document.getElementById('mainMenuScreen');
        const settingsScreen = document.getElementById('settingsScreen');
        const skinScreen = document.getElementById('skinScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayScore = document.getElementById('overlayScore');
        const colorSwatchesContainer = document.getElementById('colorSwatchesContainer');

        const goToStartBtn = document.getElementById('goToStartBtn');
        const goToSettingsBtn = document.getElementById('goToSettingsBtn');
        const goToSkinBtn = document.getElementById('goToSkinBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const saveSkinBtn = document.getElementById('saveSkinBtn');
        const overlayRestartBtn = document.getElementById('overlayRestartBtn');
        const backToMenuBtn = document.getElementById('backToMenuBtn');
        const uiRestartBtn = document.getElementById('uiRestartBtn');

        const sliders = {
            playerSpeed: document.getElementById('playerSpeed'),
            enemySpeed: document.getElementById('enemySpeed'),
            enemyCount: document.getElementById('enemyCount'),
            shootCooldown: document.getElementById('shootCooldown')
        };

        // ---- 核心配置与常量 ----
        // 尺寸放大：格子从 30 -> 40，画布 600 -> 800
        const TILE_SIZE = 40; 
        const COLS = 20;
        const ROWS = 20;
        const BULLET_SPEED = 3.0; // 子弹速度按比例提升
        const ENEMY_COLOR = '#ff3333'; 

        const PLAYER_SKINS = [
            { name: '极光绿', color: '#00ff88' },
            { name: '离子蓝', color: '#00bfff' },
            { name: '等离子黄', color: '#ffdd00' },
            { name: '幽能紫', color: '#b800ff' },
            { name: '冰晶白', color: '#e0f7fa' },
            { name: '熔岩橙', color: '#ff6600' }
        ];

        let gameConfig = {
            playerSpeed: 0.6,
            enemySpeed: 0.25,
            enemyCount: 4,
            shootCooldown: 30,
            playerColor: PLAYER_SKINS[0].color 
        };

        const DIRS = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };

        // ---- 输入控制 ----
        const keys = {
            KeyW: false, KeyA: false, KeyS: false, KeyD: false,
            ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false,
            KeyJ: false
        };
        let isMouseShooting = false;

        window.addEventListener('keydown', e => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = true;
                if (e.code.startsWith('Arrow')) e.preventDefault(); 
            }
        });
        window.addEventListener('keyup', e => {
            if (keys.hasOwnProperty(e.code)) {
                keys[e.code] = false;
                if (e.code.startsWith('Arrow')) e.preventDefault();
            }
        });

        canvas.addEventListener('mousedown', e => {
            if (e.button === 0) { 
                isMouseShooting = true;
                canvas.focus(); 
            }
        });
        canvas.addEventListener('mouseup', e => {
            if (e.button === 0) isMouseShooting = false;
        });
        canvas.addEventListener('mouseleave', () => {
            isMouseShooting = false;
        });

        function rectIntersect(r1, r2) {
            return !(r2.x >= r1.x + r1.w || r2.x + r2.w <= r1.x || r2.y >= r1.y + r1.h || r2.y + r2.h <= r1.y);
        }

        const MAPS = [
            [
                "00000000000000000000", "00110000000000001100", "00110000000000001100", "00110000220000001100",
                "00000000000000000000", "00001100000000110000", "00001100000000110000", "00220000000000000022",
                "00001100000000110000", "00001100000000110000", "00000000000000000000", "00110000220000001100",
                "00110000000000001100", "00110000000000001100", "00000000000000000000", "00000000000000000000",
                "00000000000000000000", "00000000110000000000", "00000000110000000000", "00000000000000000000"
            ],
            [
                "00000000000000000000", "00000000000000000000", "00111100000011110000", "00111100000011110000",
                "00000000000000000000", "00000000220000000000", "00110000000000110000", "00110000000000110000",
                "00000000000000000000", "00002200000022000000", "00000000000000000000", "00111100000011110000",
                "00111100000011110000", "00000000000000000000", "00000000220000000000", "00000000000000000000",
                "00110000000000110000", "00000000110000000000", "00000000110000000000", "00000000000000000000"
            ],
            [
                "00000000000000000000", "00110000000000001100", "00000000000000000000", "00001111000011110000",
                "00001111000011110000", "00000000000000000000", "00220000000000000022", "00110000000000001100",
                "00000000220000000000", "00000000220000000000", "00001100000000110000", "00001100000000110000",
                "00000000000000000000", "00000000000000000000", "00110000220000001100", "00110000000000001100",
                "00000000000000000000", "00000000110000000000", "00000000110000000000", "00000000000000000000"
            ]
        ];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 8;
                this.vy = (Math.random() - 0.5) * 8;
                this.life = 1.0;
                this.decay = 0.02 + Math.random() * 0.03;
                this.size = 2 + Math.random() * 4;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.92;
                this.vy *= 0.92;
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        let particles = [];

        // ---- 全新坦克类 ----
        class Tank {
            constructor(x, y, color, isPlayer = false) {
                this.x = x;
                this.y = y;
                this.w = TILE_SIZE - 4; // 稍微留点缝隙，40的格子用36
                this.h = TILE_SIZE - 4;
                this.color = color;
                this.dir = isPlayer ? DIRS.UP : DIRS.DOWN;
                this.isPlayer = isPlayer;
                this.speed = isPlayer ? gameConfig.playerSpeed : gameConfig.enemySpeed;
                this.cooldown = 0;
                this.aiTimer = 0;
                this.hp = 1;
            }

            draw() {
                if (this.hp <= 0) return;

                ctx.save();
                // 将坐标系移动到坦克中心
                ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
                
                // 根据方向旋转坐标系 (默认绘制朝上的坦克)
                if (this.dir === DIRS.RIGHT) ctx.rotate(Math.PI / 2);
                if (this.dir === DIRS.DOWN) ctx.rotate(Math.PI);
                if (this.dir === DIRS.LEFT) ctx.rotate(-Math.PI / 2);

                const w = this.w;
                const h = this.h;
                const halfW = w / 2;
                const halfH = h / 2;

                // 阴影
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 3;
                ctx.shadowOffsetY = 3;

                // 1. 绘制履带（左右两侧）
                ctx.fillStyle = '#1a1a1a';
                const trackWidth = 8;
                // 左履带
                ctx.fillRect(-halfW, -halfH, trackWidth, h);
                // 右履带
                ctx.fillRect(halfW - trackWidth, -halfH, trackWidth, h);

                // 履带纹理（一节一节的线）
                ctx.fillStyle = '#333';
                for (let i = -halfH + 4; i < halfH; i += 8) {
                    ctx.fillRect(-halfW, i, trackWidth, 2);
                    ctx.fillRect(halfW - trackWidth, i, trackWidth, 2);
                }

                // 去除阴影，开始画车身
                ctx.shadowColor = 'transparent';

                // 2. 绘制车身主体（带渐变反光）
                const bodyGrad = ctx.createLinearGradient(-halfW, 0, halfW, 0);
                bodyGrad.addColorStop(0, 'rgba(0,0,0,0.5)');
                bodyGrad.addColorStop(0.2, this.color);
                bodyGrad.addColorStop(0.8, this.color);
                bodyGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
                
                ctx.fillStyle = bodyGrad;
                // 圆角车身
                ctx.beginPath();
                const bodyW = w - trackWidth * 2;
                if (ctx.roundRect) {
                    ctx.roundRect(-bodyW / 2, -halfH + 2, bodyW, h - 4, 4);
                } else {
                    ctx.rect(-bodyW / 2, -halfH + 2, bodyW, h - 4); // 兼容老浏览器
                }
                ctx.fill();

                // 3. 绘制炮塔底座
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.arc(0, 0, 10, 0, Math.PI * 2);
                ctx.fill();

                // 4. 绘制炮管
                ctx.fillStyle = '#222';
                // 炮管主干
                ctx.fillRect(-3, -halfH - 12, 6, 24);
                // 炮管高光
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(-1, -halfH - 10, 2, 20);
                // 炮口制退器（前端稍微粗一点）
                ctx.fillStyle = '#111';
                ctx.fillRect(-4, -halfH - 14, 8, 6);
                
                // 5. 绘制圆形炮塔
                const turretGrad = ctx.createRadialGradient(-2, -2, 2, 0, 0, 9);
                turretGrad.addColorStop(0, '#fff');
                turretGrad.addColorStop(0.3, this.color);
                turretGrad.addColorStop(1, 'rgba(0,0,0,0.6)');
                
                ctx.fillStyle = turretGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 9, 0, Math.PI * 2);
                ctx.fill();
                
                // 炮塔边缘描边
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();
            }

            update() {
                if (this.hp <= 0) return;
                if (this.cooldown > 0) this.cooldown--;

                let dx = 0, dy = 0;
                let moving = false;

                if (this.isPlayer) {
                    if (keys.KeyW || keys.ArrowUp) { this.dir = DIRS.UP; dy = -this.speed; moving = true; }
                    else if (keys.KeyS || keys.ArrowDown) { this.dir = DIRS.DOWN; dy = this.speed; moving = true; }
                    else if (keys.KeyA || keys.ArrowLeft) { this.dir = DIRS.LEFT; dx = -this.speed; moving = true; }
                    else if (keys.KeyD || keys.ArrowRight) { this.dir = DIRS.RIGHT; dx = this.speed; moving = true; }

                    if ((isMouseShooting || keys.KeyJ) && this.cooldown === 0) {
                        this.shoot();
                    }
                } else {
                    this.aiTimer--;
                    if (this.aiTimer <= 0) {
                        this.dir = Math.floor(Math.random() * 4);
                        this.aiTimer = 60 + Math.random() * 100;
                        if (Math.random() > 0.5) this.shoot();
                    }
                    if (this.dir === DIRS.UP) dy = -this.speed;
                    if (this.dir === DIRS.DOWN) dy = this.speed;
                    if (this.dir === DIRS.LEFT) dx = -this.speed;
                    if (this.dir === DIRS.RIGHT) dx = this.speed;
                    moving = true;
                }

                if (moving) {
                    let nextX = this.x + dx;
                    let nextY = this.y + dy;

                    if (nextX < 0) nextX = 0;
                    if (nextX + this.w > canvas.width) nextX = canvas.width - this.w;
                    if (nextY < 0) nextY = 0;
                    if (nextY + this.h > canvas.height) nextY = canvas.height - this.h;

                    let collided = false;
                    for (let wall of walls) {
                        if (rectIntersect({x: nextX, y: nextY, w: this.w, h: this.h}, wall)) {
                            collided = true;
                            break;
                        }
                    }
                    if (rectIntersect({x: nextX, y: nextY, w: this.w, h: this.h}, base)) {
                        collided = true;
                    }

                    if (!collided) {
                        this.x = nextX;
                        this.y = nextY;
                    } else if (!this.isPlayer) {
                        this.dir = Math.floor(Math.random() * 4);
                        this.aiTimer = 30;
                    }
                }
            }

            shoot() {
                this.cooldown = this.isPlayer ? gameConfig.shootCooldown : Math.max(gameConfig.shootCooldown, 40);
                let bx = this.x + this.w / 2 - 4;
                let by = this.y + this.h / 2 - 4;
                bullets.push(new Bullet(bx, by, this.dir, this.isPlayer));
                
                // 开火火花
                for(let i=0; i<4; i++) {
                    particles.push(new Particle(bx+4, by+4, this.isPlayer ? '#00ffff' : '#ffaa00'));
                }
            }
        }

        class Bullet {
            constructor(x, y, dir, isPlayer) {
                this.x = x;
                this.y = y;
                this.w = 8;
                this.h = 8;
                this.dir = dir;
                this.isPlayer = isPlayer;
                this.dead = false;
                this.speed = isPlayer ? BULLET_SPEED : BULLET_SPEED * 0.6; 
                this.trail = [];
            }

            update() {
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > 6) this.trail.shift();

                if (this.dir === DIRS.UP) this.y -= this.speed;
                if (this.dir === DIRS.DOWN) this.y += this.speed;
                if (this.dir === DIRS.LEFT) this.x -= this.speed;
                if (this.dir === DIRS.RIGHT) this.x += this.speed;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.dead = true;
                }
            }

            draw() {
                const bColor = this.isPlayer ? '#00ffff' : '#ff3333';
                
                // 尾迹
                for(let i=0; i<this.trail.length; i++) {
                    ctx.fillStyle = bColor;
                    ctx.globalAlpha = i / this.trail.length * 0.6;
                    ctx.beginPath();
                    ctx.arc(this.trail[i].x + 4, this.trail[i].y + 4, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;

                // 弹头
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x + 4, this.y + 4, 4, 0, Math.PI * 2);
                ctx.fill();

                // 光晕
                ctx.fillStyle = bColor;
                ctx.globalAlpha = 0.5;
                ctx.beginPath();
                ctx.arc(this.x + 4, this.y + 4, 9, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        // ---- 游戏状态 ----
        let player;
        let enemies = [];
        let bullets = [];
        let walls = [];
        // 基地坐标根据新尺寸调整
        let base = { x: 9 * TILE_SIZE, y: 19 * TILE_SIZE, w: TILE_SIZE * 2, h: TILE_SIZE };
        let gameOver = true; 
        let score = 0;

        function initGame() {
            for (let k in keys) keys[k] = false;
            isMouseShooting = false;
            enemies = [];
            bullets = [];
            walls = [];
            particles = [];
            gameOver = false;
            score = 0;
            scoreEl.textContent = '0';

            player = new Tank(9 * TILE_SIZE, 18 * TILE_SIZE, gameConfig.playerColor, true);

            const mapData = MAPS[Math.floor(Math.random() * MAPS.length)];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let tile = mapData[r][c];
                    if (tile === '1') {
                        walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'brick' });
                    } else if (tile === '2') {
                        walls.push({ x: c * TILE_SIZE, y: r * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'steel' });
                    }
                }
            }

            walls.push({ x: 8 * TILE_SIZE, y: 18 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'brick' });
            walls.push({ x: 11 * TILE_SIZE, y: 18 * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE, type: 'brick' });

            const maxSpawns = [
                {x: 0, y: 0}, {x: 9 * TILE_SIZE, y: 0}, {x: 18 * TILE_SIZE, y: 0}, 
                {x: 0, y: 5 * TILE_SIZE}, {x: 18 * TILE_SIZE, y: 5 * TILE_SIZE},
                {x: 9 * TILE_SIZE, y: 5 * TILE_SIZE}, {x: 0, y: 10 * TILE_SIZE}, {x: 18 * TILE_SIZE, y: 10 * TILE_SIZE}
            ];
            for (let i = 0; i < gameConfig.enemyCount; i++) {
                let spawn = maxSpawns[i % maxSpawns.length];
                enemies.push(new Tank(spawn.x, spawn.y, ENEMY_COLOR, false));
            }

            updateEnemyUI();
            setTimeout(() => canvas.focus(), 50);
        }

        function updateEnemyUI() {
            const alive = enemies.filter(e => e.hp > 0).length;
            enemyEl.textContent = alive;
        }

        function endGame(isWin) {
            gameOver = true;
            overlayTitle.textContent = isWin ? '任务完成' : '基地被毁';
            overlayTitle.style.color = isWin ? '#00ff88' : '#ff3333';
            overlayScore.textContent = `最终得分: ${score}`;
            gameOverScreen.classList.add('active');
        }

        function drawBackground() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * TILE_SIZE, 0);
                ctx.lineTo(i * TILE_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * TILE_SIZE);
                ctx.lineTo(canvas.width, i * TILE_SIZE);
                ctx.stroke();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (gameOver) return;

            drawBackground();

            // 基地
            ctx.save();
            ctx.shadowColor = '#ffaa00';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#FFD700'; 
            ctx.beginPath();
            ctx.moveTo(base.x + TILE_SIZE, base.y);
            ctx.lineTo(base.x + base.w, base.y + 12);
            ctx.lineTo(base.x + base.w - 12, base.y + base.h - 6);
            ctx.lineTo(base.x + TILE_SIZE, base.y + base.h);
            ctx.lineTo(base.x + 12, base.y + base.h - 6);
            ctx.lineTo(base.x, base.y + 12);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#000';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('★', base.x + TILE_SIZE, base.y + 28);

            // 墙壁
            for (let wall of walls) {
                if (wall.type === 'brick') {
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                    ctx.strokeStyle = '#4a2000';
                    ctx.lineWidth = 1;
                    // 砖块大纹理
                    ctx.beginPath(); ctx.moveTo(wall.x, wall.y + wall.h/2); ctx.lineTo(wall.x + wall.w, wall.y + wall.h/2); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(wall.x + wall.w/2, wall.y); ctx.lineTo(wall.x + wall.w/2, wall.y + wall.h/2); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(wall.x + wall.w/4, wall.y + wall.h/2); ctx.lineTo(wall.x + wall.w/4, wall.y + wall.h); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(wall.x + wall.w*0.75, wall.y + wall.h/2); ctx.lineTo(wall.x + wall.w*0.75, wall.y + wall.h); ctx.stroke();
                } else {
                    ctx.fillStyle = '#666';
                    ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
                    ctx.strokeStyle = '#999';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(wall.x + 3, wall.y + 3, wall.w - 6, wall.h - 6);
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.moveTo(wall.x + 5, wall.y + 5);
                    ctx.lineTo(wall.x + wall.w - 5, wall.y + 5);
                    ctx.lineTo(wall.x + 5, wall.y + wall.h - 5);
                    ctx.fill();
                }
            }

            if (player.hp > 0) player.draw();
            for (let enemy of enemies) enemy.draw();
            for (let bullet of bullets) bullet.draw();

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
        }

        function update() {
            if (gameOver) return;

            if (player.hp > 0) player.update();
            for (let enemy of enemies) enemy.update();

            for (let i = bullets.length - 1; i >= 0; i--) {
                let bullet = bullets[i];
                bullet.update();

                // 打墙
                for (let j = walls.length - 1; j >= 0; j--) {
                    let wall = walls[j];
                    if (rectIntersect(bullet, wall)) {
                        bullet.dead = true;
                        for(let k=0; k<8; k++) {
                            particles.push(new Particle(bullet.x, bullet.y, wall.type === 'brick' ? '#ffaa00' : '#ffffff'));
                        }
                        if (wall.type === 'brick') walls.splice(j, 1);
                        break;
                    }
                }

                // 打基地
                if (rectIntersect(bullet, base)) {
                    bullet.dead = true;
                    for(let k=0; k<40; k++) {
                        particles.push(new Particle(base.x + TILE_SIZE, base.y + TILE_SIZE/2, '#FFD700'));
                    }
                    endGame(false);
                }

                // 打坦克
                if (bullet.isPlayer) {
                    for (let enemy of enemies) {
                        if (enemy.hp > 0 && rectIntersect(bullet, enemy)) {
                            bullet.dead = true;
                            enemy.hp = 0;
                            score += 100;
                            scoreEl.textContent = score;
                            updateEnemyUI();
                            for(let k=0; k<30; k++) {
                                particles.push(new Particle(enemy.x + enemy.w/2, enemy.y + enemy.h/2, '#ff3333'));
                            }
                            break;
                        }
                    }
                } else {
                    if (player.hp > 0 && rectIntersect(bullet, player)) {
                        bullet.dead = true;
                        player.hp = 0;
                        for(let k=0; k<40; k++) {
                            particles.push(new Particle(player.x + player.w/2, player.y + player.h/2, gameConfig.playerColor));
                        }
                        endGame(false);
                    }
                }

                if (bullet.dead) bullets.splice(i, 1);
            }

            if (enemies.every(e => e.hp === 0)) {
                endGame(true);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---- UI 交互事件 ----
        Object.keys(sliders).forEach(key => {
            sliders[key].addEventListener('input', (e) => {
                let val = parseFloat(e.target.value);
                gameConfig[key] = val;
                document.getElementById(`val${key.charAt(0).toUpperCase() + key.slice(1)}`).textContent = val;
            });
        });

        function renderSkinSwatches() {
            colorSwatchesContainer.innerHTML = '';
            PLAYER_SKINS.forEach(skin => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                if (gameConfig.playerColor === skin.color) {
                    swatch.classList.add('selected');
                }
                swatch.style.backgroundColor = skin.color;
                swatch.style.color = skin.color; 
                swatch.title = skin.name;
                
                swatch.addEventListener('click', () => {
                    gameConfig.playerColor = skin.color;
                    renderSkinSwatches();
                });
                
                colorSwatchesContainer.appendChild(swatch);
            });
        }

        goToStartBtn.addEventListener('click', () => {
            mainMenuScreen.classList.remove('active');
            initGame();
        });

        goToSettingsBtn.addEventListener('click', () => {
            mainMenuScreen.classList.remove('active');
            settingsScreen.classList.add('active');
        });

        saveSettingsBtn.addEventListener('click', () => {
            settingsScreen.classList.remove('active');
            mainMenuScreen.classList.add('active');
        });

        goToSkinBtn.addEventListener('click', () => {
            mainMenuScreen.classList.remove('active');
            renderSkinSwatches(); 
            skinScreen.classList.add('active');
        });

        saveSkinBtn.addEventListener('click', () => {
            skinScreen.classList.remove('active');
            mainMenuScreen.classList.add('active');
        });

        uiRestartBtn.addEventListener('click', initGame);
        overlayRestartBtn.addEventListener('click', () => {
            gameOverScreen.classList.remove('active');
            initGame();
        });

        backToMenuBtn.addEventListener('click', () => {
            gameOverScreen.classList.remove('active');
            mainMenuScreen.classList.add('active');
        });

        renderSkinSwatches();
        gameLoop();
    </script>
</body>
</html>
